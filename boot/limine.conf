# Limine bootloader configuration.
#
# WARNING: this format changed between Limine v7 (limine.cfg, KEY=VALUE) and
# v8+ (limine.conf, `key: value`). Check the version you actually vendor and
# match its docs — CONFIG.md in the limine repo, at the tag you pinned.
# Copying a config off a blog post is a reliable way to get a boot menu that
# silently does nothing.

# TODO: boot timeout in seconds (0 = boot immediately, no menu)
# timeout: 3

# TODO: define the boot entry. Roughly:
#
# /hobby-os
#     protocol: limine
#     path: boot():/boot/kernel.elf
#
# The entry name after / is what shows in the menu. `path` must match wherever
# the ISO staging step in CMakeLists.txt actually puts kernel.elf — these two
# disagreeing is the single most common "Limine can't find my kernel" cause.
