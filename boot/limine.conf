# Limine bootloader configuration.
#
# Syntax is the v8+ `key: value` format (v7 and earlier used limine.cfg with
# KEY=VALUE). Verified against CONFIG.md at the tag pinned by LIMINE_TAG in
# CMakeLists.txt — if you bump that tag, re-read CONFIG.md before trusting this.
#
# Limine scans, in order: /limine.conf, /limine/limine.conf, /boot/limine.conf,
# /boot/limine/limine.conf. The ISO staging step in CMakeLists.txt puts this
# file at the last of those.

# 0 boots immediately with no menu. Raise it while you're bisecting boot
# problems — the menu lets you see that Limine itself is alive.
timeout: 0

/hobby-os
    protocol: limine
    # boot():/ is the partition Limine itself was loaded from. This path must
    # match where CMakeLists.txt copies kernel.elf into the ISO staging dir —
    # a mismatch here is the #1 cause of "Limine can't find my kernel".
    path: boot():/boot/kernel.elf
